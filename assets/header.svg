<svg width="100%" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ee7752;stop-opacity:1">
        <animate attributeName="stop-color" values="#ee7752;#e73c7e;#23a6d5;#23d5ab;#ee7752" dur="15s" repeatCount="indefinite" />
      </stop>
      <stop offset="25%" style="stop-color:#e73c7e;stop-opacity:1">
        <animate attributeName="stop-color" values="#e73c7e;#23a6d5;#23d5ab;#ee7752;#e73c7e" dur="15s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" style="stop-color:#23a6d5;stop-opacity:1">
        <animate attributeName="stop-color" values="#23a6d5;#23d5ab;#ee7752;#e73c7e;#23a6d5" dur="15s" repeatCount="indefinite" />
      </stop>
      <stop offset="75%" style="stop-color:#23d5ab;stop-opacity:1">
        <animate attributeName="stop-color" values="#23d5ab;#ee7752;#e73c7e;#23a6d5;#23d5ab" dur="15s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" style="stop-color:#ee7752;stop-opacity:1">
